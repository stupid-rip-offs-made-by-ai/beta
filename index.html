<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04143d">
  <meta name="description" content="Games you've definitely played before. Just worse.">
  <title>Stupid Rip-Offs Made by AI</title>
  <style>
    :root {
      --accent: #4db8ff;
      --accent-rgb: 77,184,255;
      --bg1: #0a3a9a; --bg2: #06205a; --bg3: #020c2a;
      --ease: cubic-bezier(.2,.8,.2,1);
      --tile: 140px; --tile-sel: 250px; --gap: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, system-ui, sans-serif;
      color: #fff; background: var(--bg3);
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    /* ================= BACKGROUND LAYERS ================= */
    .base { position: fixed; inset: 0; background: linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3)); transition: background .6s; }
    .hero {
      position: fixed; inset: -4%; background-size: cover; background-position: center;
      opacity: 0; transition: opacity .7s ease;
      filter: saturate(1.15);
      animation: drift 30s ease-in-out infinite alternate;
    }
    .hero.show { opacity: .55; }
    @keyframes drift { from { transform: scale(1.02) translate(0,0); } to { transform: scale(1.1) translate(-2%, -1%); } }
    .shade {
      position: fixed; inset: 0;
      background:
        linear-gradient(90deg, rgba(2,10,35,.92) 0%, rgba(2,10,35,.55) 45%, rgba(2,10,35,.25) 100%),
        linear-gradient(0deg, rgba(2,10,35,.95) 0%, rgba(2,10,35,0) 55%);
    }
    #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ================= LAYOUT ================= */
    .ui { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 4vw 0;
    }
    .profile { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #ffe94d, #ff3b6b);
      display: grid; place-items: center; font-size: 22px;
      box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 4px 14px rgba(0,0,0,.4);
    }
    .profile .name { font-size: 18px; font-weight: 600; letter-spacing: .3px; line-height: 1.1; }
    .profile .sub { font-size: 12px; opacity: .7; font-weight: 300; }
    .status { display: flex; align-items: center; gap: 20px; font-size: 18px; font-weight: 300; }
    .status .count { font-size: 14px; opacity: .75; }
    .online { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    /* --- function row (top icons) --- */
    .funcs { display: flex; gap: 10px; padding: 3.5vh 4vw 0; }
    .fn {
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      transition: transform .2s var(--ease), background .2s, box-shadow .2s;
      position: relative;
    }
    .fn svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .fn .lbl {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .fn:hover, .fn.focus { background: rgba(255,255,255,.2); transform: scale(1.12); }
    .fn.focus { box-shadow: 0 0 0 2px #fff, 0 0 18px rgba(var(--accent-rgb), .8); }
    .fn:hover .lbl, .fn.focus .lbl { opacity: .9; }
    .fn.off svg { opacity: .45; }

    /* --- tile row --- */
    .row-wrap { margin-top: 5vh; position: relative; height: var(--tile-sel); }
    .row {
      position: absolute; left: 4vw; bottom: 0;
      display: flex; align-items: flex-end; gap: var(--gap);
      transition: transform .35s var(--ease);
      will-change: transform;
    }
    .tile {
      flex: 0 0 auto; width: var(--tile); height: var(--tile);
      border-radius: 6px; overflow: hidden; position: relative; cursor: pointer;
      background: #123 center / cover no-repeat;
      box-shadow: 0 8px 20px rgba(0,0,0,.45);
      transition: width .35s var(--ease), height .35s var(--ease), box-shadow .35s, filter .35s;
      filter: brightness(.82);
    }
    .tile .emoji { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--tile) * .45); transition: font-size .35s; }
    .tile.has-img .emoji { display: none; }
    .tile::before {        /* gloss */
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(155deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 40%);
    }
    .tile::after {         /* name fade at bottom */
      content: ""; position: absolute; inset: 50% 0 0 0; pointer-events: none;
      background: linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0));
    }
    .tile .tname {
      position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 2;
      font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px #000;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity .2s;
    }
    .tile .badge {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      font-size: 10px; font-weight: 700; letter-spacing: .8px;
      background: var(--accent); color: #001a3a; padding: 3px 7px; border-radius: 3px;
    }
    .tile:hover { filter: brightness(1); }
    .tile.sel {
      width: var(--tile-sel); height: var(--tile-sel); filter: brightness(1);
      box-shadow: 0 0 0 3px #fff, 0 0 34px 6px rgba(var(--accent-rgb), .65), 0 18px 40px rgba(0,0,0,.6);
    }
    .tile.sel .emoji { font-size: calc(var(--tile-sel) * .45); }
    .tile.sel .tname { opacity: 0; }
    .row.dim .tile.sel { box-shadow: 0 0 0 2px rgba(255,255,255,.5), 0 18px 40px rgba(0,0,0,.6); }

    /* shimmer that sweeps across the selected tile */
    .tile.sel .shine {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
      background-size: 250% 100%;
      animation: shine 3.2s ease-in-out infinite;
    }
    @keyframes shine { 0% { background-position: 150% 0; } 40%, 100% { background-position: -100% 0; } }

    /* --- info --- */
    .info { padding: 26px 4vw 0; max-width: 820px; }
    .info .meta { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
    .info h1 { font-weight: 300; font-size: clamp(30px, 4.2vw, 54px); letter-spacing: .3px; line-height: 1.1; margin-top: 4px; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
    .info .ripoff { margin-top: 6px; font-size: clamp(14px, 1.4vw, 18px); font-style: italic; opacity: .8; }
    .info .desc { margin-top: 10px; font-size: clamp(15px, 1.5vw, 19px); font-weight: 300; opacity: .92; max-width: 640px; }
    .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 28px; border-radius: 4px; font-weight: 600; font-size: 16px;
      transition: transform .15s, background .2s, box-shadow .2s;
    }
    .btn.primary { background: #fff; color: #062260; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
    .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.5), 0 0 0 3px rgba(var(--accent-rgb), .5); }
    .btn.ghost { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); }
    .btn.ghost:hover { background: rgba(255,255,255,.2); }
    .info.swap > * { animation: rise .4s var(--ease) both; }
    .info.swap > *:nth-child(2) { animation-delay: .03s; }
    .info.swap > *:nth-child(3) { animation-delay: .06s; }
    .info.swap > *:nth-child(4) { animation-delay: .09s; }
    .info.swap > *:nth-child(5) { animation-delay: .12s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* --- bottom hints --- */
    .hints {
      margin-top: auto; padding: 0 4vw max(20px, env(safe-area-inset-bottom));
      display: flex; gap: 24px; font-size: 13px; opacity: .7; font-weight: 300;
    }
    .key { display: inline-block; min-width: 22px; text-align: center; border: 1px solid rgba(255,255,255,.55); border-radius: 4px; padding: 1px 6px; margin-right: 6px; font-size: 12px; }

    /* ================= OVERLAYS ================= */
    /* boot screen */
    #boot {
      position: fixed; inset: 0; z-index: 50; background: #000;
      display: grid; place-items: center; text-align: center; cursor: pointer;
      transition: opacity .8s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    .boot-logo { font-weight: 200; font-size: clamp(30px, 6vw, 72px); letter-spacing: .12em; text-transform: uppercase; }
    .boot-logo span { display: inline-block; opacity: 0; animation: letter .6s var(--ease) forwards; }
    .boot-logo b { font-weight: 700; color: var(--accent); }
    @keyframes letter { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
    .boot-sub { margin-top: 10px; font-size: clamp(13px, 1.5vw, 17px); opacity: 0; letter-spacing: .3em; animation: fadein 1s 1.2s forwards; }
    .boot-press { margin-top: 9vh; font-size: 15px; letter-spacing: .25em; text-transform: uppercase; opacity: 0; animation: fadein .8s 1.8s forwards, pulse 2s 2.6s ease-in-out infinite; }
    @keyframes fadein { to { opacity: .85; } }
    @keyframes pulse { 0%,100% { opacity: .85; } 50% { opacity: .25; } }
    .boot-line { width: 0; height: 1px; margin: 22px auto 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: line 1.4s .6s var(--ease) forwards; }
    @keyframes line { to { width: min(520px, 70vw); } }

    /* launch screen */
    #launch {
      position: fixed; inset: 0; z-index: 40; background: #000 center / cover no-repeat;
      opacity: 0; pointer-events: none; transition: opacity .35s;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 0 6vw 10vh;
    }
    #launch::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.92), rgba(0,0,0,.2) 60%); }
    #launch.on { opacity: 1; pointer-events: auto; }
    #launch > * { position: relative; }
    #launch .lemoji { position: absolute; right: 8vw; top: 50%; transform: translateY(-60%); font-size: min(34vw, 40vh); filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); animation: pop .5s var(--ease); }
    #launch .lt { font-size: clamp(32px, 5vw, 64px); font-weight: 300; }
    #launch .ls { margin-top: 8px; opacity: .75; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
    .bar { margin-top: 22px; width: min(420px, 80vw); height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    #launch.on .bar i { animation: load 1s var(--ease) forwards; }
    @keyframes load { to { width: 100%; } }

    /* toast notifications */
    #toasts { position: fixed; top: max(80px, calc(env(safe-area-inset-top) + 64px)); right: 4vw; z-index: 30; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      display: flex; align-items: center; gap: 12px; min-width: 240px; max-width: 340px;
      background: rgba(8,22,60,.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.15); border-left: 3px solid var(--accent);
      padding: 12px 16px; border-radius: 6px; font-size: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      animation: toastIn .4s var(--ease) both;
    }
    .toast.out { animation: toastOut .35s ease forwards; }
    .toast .ti { font-size: 22px; }
    .toast small { display: block; opacity: .65; font-size: 12px; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

    /* theme picker + about panel */
    .panel-bg { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; place-items: center; }
    .panel-bg.open { display: grid; animation: fadeBg .25s ease; }
    @keyframes fadeBg { from { opacity: 0; } }
    .panel {
      width: min(560px, 92vw); background: rgba(10,26,70,.92);
      border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 26px;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
      animation: pop .3s var(--ease);
    }
    @keyframes pop { from { opacity: 0; transform: scale(.94); } }
    .panel h2 { font-weight: 300; font-size: 26px; margin-bottom: 16px; }
    .panel p { font-weight: 300; opacity: .85; line-height: 1.5; margin-bottom: 10px; }
    .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .swatch {
      height: 84px; border-radius: 8px; position: relative; overflow: hidden;
      border: 2px solid transparent; text-align: left; padding: 10px; font-size: 14px; font-weight: 600;
      display: flex; align-items: flex-end; transition: transform .15s, border-color .15s;
    }
    .swatch:hover, .swatch.focus { transform: scale(1.04); border-color: #fff; }
    .swatch.cur::after { content: "✓"; position: absolute; top: 8px; right: 10px; font-size: 16px; }
    .panel .close { margin-top: 18px; }

    /* ================= SMALL SCREENS ================= */
    @media (max-width: 700px) {
      :root { --tile: 90px; --tile-sel: 168px; --gap: 12px; }
      .funcs { padding-top: 2.5vh; gap: 8px; }
      .fn { width: 44px; height: 44px; }
      .fn svg { width: 20px; height: 20px; }
      .row-wrap { margin-top: 4vh; }
      .hints, .status .count, .profile .sub { display: none; }
      .info { padding-top: 18px; }
      .btn { padding: 11px 22px; }
      .swatches { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-height: 560px) and (min-width: 701px) {
      :root { --tile: 110px; --tile-sel: 190px; }
      .hints { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero { animation: none; }
      .tile.sel .shine { display: none; }
    }
  </style>
</head>
<body>
  <!-- background -->
  <div class="base"></div>
  <div class="hero" id="heroA"></div>
  <div class="hero" id="heroB"></div>
  <div class="shade"></div>
  <canvas id="fx"></canvas>

  <!-- main menu -->
  <div class="ui">
    <div class="topbar">
      <div class="profile">
        <div class="avatar">🤖</div>
        <div>
          <div class="name">Stupid Rip-Offs</div>
          <div class="sub">Made by AI</div>
        </div>
      </div>
      <div class="status">
        <span class="count" id="count"></span>
        <span class="online" title="Online"></span>
        <span id="clock"></span>
      </div>
    </div>

    <div class="funcs" id="funcs">
      <button class="fn" data-fn="random" aria-label="Random game">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="#fff"/><circle cx="16" cy="16" r="1.3" fill="#fff"/><circle cx="12" cy="12" r="1.3" fill="#fff"/><circle cx="16" cy="8" r="1.3" fill="#fff"/><circle cx="8" cy="16" r="1.3" fill="#fff"/></svg>
        <span class="lbl">Random game</span>
      </button>
      <button class="fn" data-fn="theme" aria-label="Themes">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.9-.7-1.3-.7-2.2 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.8 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="#fff"/><circle cx="10" cy="7" r="1.2" fill="#fff"/><circle cx="15" cy="7.5" r="1.2" fill="#fff"/></svg>
        <span class="lbl">Themes</span>
      </button>
      <button class="fn" data-fn="sound" aria-label="Sound">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span class="lbl">Sound</span>
      </button>
      <button class="fn" data-fn="full" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="lbl">Fullscreen</span>
      </button>
      <button class="fn" data-fn="about" aria-label="About">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        <span class="lbl">About</span>
      </button>
    </div>

    <div class="row-wrap"><div class="row" id="row"></div></div>

    <div class="info" id="info"></div>

    <div class="hints">
      <span><span class="key">←</span><span class="key">→</span>Choose game</span>
      <span><span class="key">↑</span>Menu</span>
      <span><span class="key">Enter</span>Start</span>
      <span><span class="key">R</span>Random</span>
      <span>🎮 Controllers work too</span>
    </div>
  </div>

  <!-- overlays -->
  <div id="toasts"></div>

  <div class="panel-bg" id="themePanel">
    <div class="panel">
      <h2>Themes</h2>
      <div class="swatches" id="swatches"></div>
      <button class="btn ghost close" data-close>Done</button>
    </div>
  </div>

  <div class="panel-bg" id="aboutPanel">
    <div class="panel">
      <h2>Stupid Rip-Offs Made by AI</h2>
      <p>Games you've definitely played before. Just worse.</p>
      <p id="aboutCount"></p>
      <p>Any resemblance to real games is entirely intentional.</p>
      <button class="btn ghost close" data-close>Close</button>
    </div>
  </div>

  <div id="launch">
    <div class="lemoji" id="launchEmoji"></div>
    <div class="ls">Starting</div>
    <div class="lt" id="launchTitle"></div>
    <div class="bar"><i></i></div>
  </div>

  <div id="boot">
    <div>
      <div class="boot-logo" id="bootLogo"></div>
      <div class="boot-line"></div>
      <div class="boot-sub">MADE BY AI</div>
      <div class="boot-press">Press any button</div>
    </div>
  </div>

  <script src="games.js"></script>
  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const store = {
      get(k, d) { try { const v = localStorage.getItem('srmai-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem('srmai-' + k, JSON.stringify(v)); } catch (e) {} }
    };

    const list = (typeof GAMES !== 'undefined' ? GAMES : []).filter(Boolean);
    const linkOf = g => g.url || ('games/' + g.file);

    // ================= THEMES =================
    const THEMES = {
      Ocean:    { accent: '#4db8ff', bg: ['#0a3a9a', '#06205a', '#020c2a'] },
      Galaxy:   { accent: '#b98cff', bg: ['#3b1a8a', '#1d0d4d', '#08031c'] },
      Crimson:  { accent: '#ff5a6e', bg: ['#8a1030', '#4a0a20', '#14030a'] },
      Emerald:  { accent: '#3dffb0', bg: ['#0b6b55', '#073d33', '#021411'] },
      Gold:     { accent: '#ffcc33', bg: ['#7a5a0a', '#3d2c06', '#120c02'] },
      Midnight: { accent: '#e0e6ff', bg: ['#2a2f3d', '#141821', '#05060a'] },
    };
    let themeName = store.get('theme', 'Ocean'); if (!THEMES[themeName]) themeName = 'Ocean';
    function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function applyTheme(name) {
      themeName = name; const t = THEMES[name], r = document.documentElement.style;
      r.setProperty('--accent', t.accent); r.setProperty('--accent-rgb', hexRgb(t.accent).join(','));
      r.setProperty('--bg1', t.bg[0]); r.setProperty('--bg2', t.bg[1]); r.setProperty('--bg3', t.bg[2]);
      document.querySelector('meta[name=theme-color]').content = t.bg[2];
      store.set('theme', name);
    }
    applyTheme(themeName);

    // ================= SOUND =================
    let muted = store.get('muted', false), ac;
    function tone(freq, len = .06, type = 'sine', vol = .05, when = 0) {
      if (muted) return;
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        const t0 = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t0);
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + len);
        o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + len + .02);
      } catch (e) {}
    }
    const sfx = {
      move:   () => tone(720, .05, 'sine', .04),
      menu:   () => tone(520, .05, 'triangle', .04),
      ok:     () => { tone(880, .09, 'sine', .05); tone(1320, .12, 'sine', .035, .05); },
      back:   () => tone(400, .08, 'sine', .04),
      start:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, 'sine', .045, i * .07)),
      boot:   () => [262, 392, 523, 659, 784].forEach((f, i) => tone(f, 1.6 - i * .15, 'sine', .035, i * .12)),
    };

    // ================= WAVES + PARTICLES =================
    const cv = $('#fx'), cx = cv.getContext('2d');
    let W, H, DPR;
    function size() { DPR = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
    size(); addEventListener('resize', size);
    const parts = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 2.6 + .6, s: Math.random() * .25 + .05, p: Math.random() * 6.28 }));
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function frame(t) {
      cx.clearRect(0, 0, W, H);
      const [ar, ag, ab] = hexRgb(THEMES[themeName].accent);
      // flowing ribbons
      for (let i = 0; i < 10; i++) {
        cx.beginPath();
        const amp = H * (.045 + i * .007), base = H * (.7 + i * .011), sp = t / (6000 + i * 800);
        for (let x = 0; x <= W; x += 10 * DPR) {
          const u = x / W;
          const y = base + Math.sin(u * 6.28 + sp + i * .55) * amp + Math.sin(u * 9 - sp * 1.6) * amp * .3;
          x ? cx.lineTo(x, y) : cx.moveTo(x, y);
        }
        cx.strokeStyle = `rgba(${ar},${ag},${ab},${.06 + (i % 3) * .045})`;
        cx.lineWidth = (1 + (i % 3) * .8) * DPR;
        cx.stroke();
      }
      // floating light particles
      for (const p of parts) {
        if (!reduce) { p.y -= p.s * .0006; p.x += Math.sin(t / 3000 + p.p) * .00015; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); } }
        const a = .25 + .25 * Math.sin(t / 900 + p.p);
        const g = cx.createRadialGradient(p.x * W, p.y * H, 0, p.x * W, p.y * H, p.r * 4 * DPR);
        g.addColorStop(0, `rgba(${ar},${ag},${ab},${a})`); g.addColorStop(1, `rgba(${ar},${ag},${ab},0)`);
        cx.fillStyle = g; cx.beginPath(); cx.arc(p.x * W, p.y * H, p.r * 4 * DPR, 0, 6.28); cx.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ================= CLOCK =================
    const tick = () => $('#clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    tick(); setInterval(tick, 10000);
    $('#count').textContent = list.length + (list.length === 1 ? ' game' : ' games');
    $('#aboutCount').textContent = `${list.length} rip-offs and counting.`;

    // ================= TOASTS =================
    function toast(icon, text, sub) {
      const el = document.createElement('div'); el.className = 'toast';
      el.innerHTML = `<span class="ti">${icon}</span><div>${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
      $('#toasts').appendChild(el);
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 2600);
    }

    // ================= TILES =================
    const row = $('#row'), info = $('#info');
    const lastPlayed = store.get('last', null);
    let sel = Math.max(0, Math.min(store.get('sel', 0), list.length - 1));
    let zone = 'tiles';     // 'tiles' | 'funcs' | 'panel'
    let fnIdx = 0;

    function hue(str) { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

    list.forEach((g, i) => {
      const t = document.createElement('div');
      t.className = 'tile' + (g.image ? ' has-img' : '');
      const h = hue(g.title || i);
      t.style.backgroundPosition = (g.focus || 'center') + ', center';
      t.style.backgroundImage = (g.image ? `url("${g.image}"), ` : '') + `linear-gradient(145deg, hsl(${h} 70% 50%), hsl(${(h + 40) % 360} 75% 28%))`;
      t.innerHTML = `<span class="emoji">${g.emoji || '🎮'}</span><span class="shine"></span>` +
        (lastPlayed === (g.title || '') ? '<span class="badge">LAST PLAYED</span>' : '') +
        `<span class="tname">${esc(g.title)}</span>`;
      t.addEventListener('click', () => { setZone('tiles'); i === sel ? launch() : select(i); });
      row.appendChild(t);
    });

    // background art crossfade
    let heroFlip = false;
    function setHero(g) {
      const a = $('#heroA'), b = $('#heroB');
      const show = heroFlip ? a : b, hide = heroFlip ? b : a; heroFlip = !heroFlip;
      if (g && g.image) show.style.backgroundImage = `url("${g.image}")`;
      else { const h = hue(g.title || ''); show.style.backgroundImage = `radial-gradient(ellipse at 75% 35%, hsl(${h} 80% 45%), transparent 65%), radial-gradient(ellipse at 20% 90%, hsl(${(h + 40) % 360} 80% 35%), transparent 60%)`; }
      show.classList.add('show');
      hide.classList.remove('show');
    }

    function tileSize() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile')) || 140; }
    function gapSize() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 16; }

    function select(i, sound = true) {
      if (!list.length) return;
      sel = (i + list.length) % list.length;
      [...row.children].forEach((t, j) => t.classList.toggle('sel', j === sel));
      row.style.transform = `translateX(${-sel * (tileSize() + gapSize())}px)`;
      const g = list[sel];
      setHero(g);
      info.classList.remove('swap'); void info.offsetWidth; info.classList.add('swap');
      info.innerHTML = `
        <div class="meta">${sel + 1} / ${list.length}${lastPlayed === g.title ? ' · Last played' : ''}</div>
        <h1>${esc(g.title || 'Untitled Rip-Off')}</h1>
        <p class="ripoff">totally not ${esc(g.ripoffOf || 'a real game')}</p>
        <p class="desc">${esc(g.description || 'Just play it.')}</p>
        <div class="actions">
          <button class="btn primary" id="startBtn">▶&nbsp; Start</button>
          <button class="btn ghost" id="randBtn">🎲&nbsp; Surprise me</button>
        </div>`;
      $('#startBtn').onclick = launch;
      $('#randBtn').onclick = randomGame;
      store.set('sel', sel);
      if (sound) sfx.move();
    }

    function randomGame() {
      if (list.length < 2) return;
      let n; do { n = Math.floor(Math.random() * list.length); } while (n === sel);
      setZone('tiles'); select(n, false); sfx.ok();
      toast('🎲', 'How about this one?', list[n].title);
    }

    let launching = false;
    function launch() {
      if (!list.length || launching) return;
      launching = true;
      const g = list[sel];
      store.set('last', g.title || '');
      sfx.start();
      const L = $('#launch');
      const h = hue(g.title || '');
      L.style.backgroundImage = g.image ? `url("${g.image}")` : `radial-gradient(circle at 70% 40%, hsl(${h} 80% 45%), hsl(${(h + 40) % 360} 75% 12%) 70%)`;
      $('#launchEmoji').textContent = g.image ? '' : (g.emoji || '🎮');
      $('#launchTitle').textContent = g.title || '';
      L.classList.add('on');
      setTimeout(() => { location.href = linkOf(g); }, 1050);
    }
    // coming back with the browser Back button
    addEventListener('pageshow', () => { $('#launch').classList.remove('on'); launching = false; });

    // ================= FUNCTION ROW =================
    const fns = [...document.querySelectorAll('.fn')];
    function setZone(z) {
      zone = z;
      fns.forEach((f, i) => f.classList.toggle('focus', z === 'funcs' && i === fnIdx));
      row.classList.toggle('dim', z !== 'tiles');
    }
    function refreshSoundIcon() { $('[data-fn=sound]').classList.toggle('off', muted); }
    refreshSoundIcon();

    const actions = {
      random: randomGame,
      theme: () => openPanel('#themePanel'),
      sound: () => { muted = !muted; store.set('muted', muted); refreshSoundIcon(); if (!muted) sfx.ok(); toast(muted ? '🔇' : '🔊', muted ? 'Sound off' : 'Sound on'); },
      full: () => {
        const d = document;
        if (!d.fullscreenElement && d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => toast('⛶', 'Fullscreen not available here'));
        else if (d.exitFullscreen) d.exitFullscreen();
        else toast('⛶', 'Fullscreen not available here');
      },
      about: () => openPanel('#aboutPanel'),
    };
    fns.forEach((f, i) => f.addEventListener('click', () => { fnIdx = i; sfx.ok(); actions[f.dataset.fn](); }));

    // ================= PANELS =================
    let openP = null, swIdx = 0;
    const swatches = $('#swatches');
    Object.entries(THEMES).forEach(([name, t]) => {
      const b = document.createElement('button');
      b.className = 'swatch'; b.dataset.theme = name; b.textContent = name;
      b.style.background = `linear-gradient(135deg, ${t.bg[0]}, ${t.bg[2]})`;
      b.style.boxShadow = `inset 0 -4px 0 ${t.accent}`;
      b.onclick = () => pickTheme(name);
      swatches.appendChild(b);
    });
    const swEls = [...swatches.children];
    function markSwatches() { swEls.forEach((s, i) => { s.classList.toggle('cur', s.dataset.theme === themeName); s.classList.toggle('focus', i === swIdx); }); }
    function pickTheme(name) { applyTheme(name); markSwatches(); sfx.ok(); toast('🎨', 'Theme changed', name); }
    function openPanel(sel) {
      openP = $(sel); openP.classList.add('open'); zone = 'panel';
      swIdx = Math.max(0, swEls.findIndex(s => s.dataset.theme === themeName)); markSwatches();
    }
    function closePanel() { if (!openP) return; openP.classList.remove('open'); openP = null; sfx.back(); setZone('funcs'); }
    document.querySelectorAll('[data-close]').forEach(b => b.onclick = closePanel);
    document.querySelectorAll('.panel-bg').forEach(p => p.addEventListener('click', e => { if (e.target === p) closePanel(); }));

    // ================= INPUT =================
    function input(dir) {      // dir: left right up down ok back
      if (!booted) return boot();
      if (zone === 'panel') {
        if (openP && openP.id === 'themePanel') {
          const cols = innerWidth <= 700 ? 2 : 3;
          if (dir === 'left') swIdx = Math.max(0, swIdx - 1);
          if (dir === 'right') swIdx = Math.min(swEls.length - 1, swIdx + 1);
          if (dir === 'up') swIdx = Math.max(0, swIdx - cols);
          if (dir === 'down') swIdx = Math.min(swEls.length - 1, swIdx + cols);
          if (['left', 'right', 'up', 'down'].includes(dir)) { sfx.menu(); markSwatches(); }
          if (dir === 'ok') pickTheme(swEls[swIdx].dataset.theme);
        } else if (dir === 'ok') closePanel();
        if (dir === 'back') closePanel();
        return;
      }
      if (zone === 'funcs') {
        if (dir === 'left') { fnIdx = Math.max(0, fnIdx - 1); sfx.menu(); setZone('funcs'); }
        if (dir === 'right') { fnIdx = Math.min(fns.length - 1, fnIdx + 1); sfx.menu(); setZone('funcs'); }
        if (dir === 'down' || dir === 'back') { setZone('tiles'); sfx.back(); }
        if (dir === 'ok') { sfx.ok(); actions[fns[fnIdx].dataset.fn](); }
        return;
      }
      if (dir === 'right') select(sel + 1);
      if (dir === 'left') select(sel - 1);
      if (dir === 'up') { setZone('funcs'); sfx.menu(); }
      if (dir === 'ok') launch();
    }

    addEventListener('keydown', e => {
      const k = e.key;
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', Enter: 'ok', ' ': 'ok', Escape: 'back', Backspace: 'back' };
      if (k === 'r' || k === 'R') { if (booted && zone !== 'panel') randomGame(); return; }
      if (map[k]) { e.preventDefault(); input(map[k]); }
      else if (!booted) boot();
    });

    // swipe
    let sx = null, sy = null;
    addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    addEventListener('touchend', e => {
      if (sx === null || zone === 'panel') return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { setZone('tiles'); select(sel + (dx < 0 ? 1 : -1)); }
    });

    // wheel / trackpad
    let wheelLock = 0;
    addEventListener('wheel', e => {
      if (!booted || zone === 'panel') return;
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Date.now() < wheelLock || Math.abs(d) < 8) return;
      wheelLock = Date.now() + 160; setZone('tiles'); select(sel + (d > 0 ? 1 : -1));
    }, { passive: true });

    // game controllers
    const prev = {}; let repeatAt = 0;
    function pads() {
      const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
      if (gp) {
        const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, b = i => !!gp.buttons[i]?.pressed;
        const now = {
          left: b(14) || ax < -.6, right: b(15) || ax > .6,
          up: b(12) || ay < -.6, down: b(13) || ay > .6,
          ok: b(0) || b(9), back: b(1), rand: b(3)
        };
        const t = performance.now();
        for (const k of ['left', 'right', 'up', 'down', 'ok', 'back']) {
          if (now[k] && !prev[k]) { input(k); repeatAt = t + 420; }
          else if (now[k] && (k === 'left' || k === 'right') && t > repeatAt) { input(k); repeatAt = t + 120; }
        }
        if (now.rand && !prev.rand && booted) randomGame();
        Object.assign(prev, now);
      }
      requestAnimationFrame(pads);
    }
    addEventListener('gamepadconnected', () => { toast('🎮', 'Controller connected'); });
    requestAnimationFrame(pads);

    addEventListener('resize', () => select(sel, false));

    // ================= BOOT =================
    let booted = false;
    const logo = 'Stupid Rip-Offs';
    $('#bootLogo').innerHTML = [...logo].map((c, i) =>
      `<span style="animation-delay:${.08 + i * .05}s">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('');
    function boot() {
      if (booted) return;
      booted = true;
      $('#boot').classList.add('gone');
      sfx.boot();
      try { sessionStorage.setItem('srmai-booted', '1'); } catch (e) {}
      setTimeout(() => toast('👋', lastPlayed ? 'Welcome back!' : 'Welcome!', lastPlayed ? `Last played: ${lastPlayed}` : `${list.length} rip-offs ready`), 700);
    }
    $('#boot').addEventListener('click', boot);
    // only show the boot screen once per visit
    let seen = false; try { seen = sessionStorage.getItem('srmai-booted') === '1'; } catch (e) {}
    if (seen) { booted = true; $('#boot').style.display = 'none'; }

    if (!list.length) info.innerHTML = '<div class="meta">Empty</div><h1>No rip-offs here yet</h1><p class="desc">Check back soon.</p>';
    else select(sel, false);
  })();
  </script>
</body>
</html>
